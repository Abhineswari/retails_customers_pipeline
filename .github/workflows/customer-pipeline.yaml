name: Customer Processing Pipeline

on:
  push:
    branches:
      - main

jobs:
  process-customers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run customer processing
        uses: actions/checkout@v4
      - name: Run customer processing
        uses: actions/setup-python@v5
        with:
           python-version: '3.11'
           
      - name: Run customer processing script
        run: python customer_processing.py
      - name: success message
        run: echo " customer processing executed"
        


