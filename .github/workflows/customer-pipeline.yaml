name: Customer Processing Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
     - uses: actions/checkout@v4
     - run: echo "deploy to dev"
    
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: QA

    steps:
     - uses: actions/checkout@v4
     - run: echo "deploy to QV"
  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: PROD

    steps:
     - uses: actions/checkout@v4
     - run: echo "deploy to PROD"
  

      
